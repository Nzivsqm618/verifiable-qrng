[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vqrng"
version = "0.2.0"
description = "Verifiable quantum random number generator: Python SDK and Unix CLI built with Qiskit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your GitHub Handle" }
]
keywords = ["qiskit", "quantum", "entropy", "qrng", "chsh", "cryptography"]

dependencies = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "qiskit-aer>=0.13.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
]
cli = [
    "click>=8.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
vqrng = "vqrng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=vqrng --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["vqrng"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true