[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-qrng"
version = "0.1.0"
description = "A Device-Independent Quantum Random Number Generator (DI-QRNG) built with Qiskit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your GitHub Handle" }
]
keywords = ["qiskit", "quantum", "entropy", "qrng", "chsh", "cryptography"]

dependencies = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "qiskit-aer>=0.13.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
cli = [
    "click>=8.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]