[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vqrng"
version = "0.4.0"
description = "Research-grade verifiable quantum random number generator: Python SDK and Unix CLI built with Qiskit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Frankie Li" }
]
keywords = ["qiskit", "quantum", "entropy", "qrng", "chsh", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "qiskit-aer>=0.13.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "cryptography>=41.0.0",
]
sign = [
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/Nzivsqm618/verifiable-qrng"
Repository = "https://github.com/Nzivsqm618/verifiable-qrng"
Issues = "https://github.com/Nzivsqm618/verifiable-qrng/issues"

[project.scripts]
vqrng = "vqrng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=vqrng --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["vqrng"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true